version: '3.8'

name: rycoop-smart-finance-test

services:
  # 1. Reverse Proxy with TLS & SSE Buffering Configuration
  # Bound strictly to 127.0.0.1 (Never exposes 80/443 to host network)
  nginx:
    image: nginx:1.27-alpine
    container_name: rycoop_test_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - ingress_net
      - app_net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # 2. Next.js Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: rycoop_test_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - ingress_net
      - app_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 512M

  # 3. NestJS Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rycoop_test_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=test
      - APP_ENV=test
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN}
      - COOKIE_DOMAIN=test.rycoop.coop
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net
      - data_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          memory: 512M

  # 4. Python FastAPI Analytics Worker
  analytics-worker:
    build:
      context: ../analytics-worker
      dockerfile: Dockerfile
    container_name: rycoop_test_analytics
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=test
      - BACKEND_API_URL=http://backend:3001
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # 5. PostgreSQL 16 Database (Isolated from public and frontend networks)
  postgres:
    image: postgres:16-alpine
    container_name: rycoop_test_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - rycoop_test_pgdata:/var/lib/postgresql/data
      - ../database/migrations/init_schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../database/seeds/seed_test_data.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    networks:
      - data_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
        reservations:
          memory: 512M

  # 6. Redis 7 (Isolated from public and frontend networks)
  redis:
    image: redis:7-alpine
    container_name: rycoop_test_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - rycoop_test_redisdata:/data
    networks:
      - data_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

# Network Segmentation:
# - ingress_net: Nginx to Frontend (Public Facing Ingress)
# - app_net: Nginx to Backend, Frontend to Backend, Analytics to Backend
# - data_net: Backend to Postgres & Redis (Zero external exposure)
networks:
  ingress_net:
    driver: bridge
    name: rycoop_test_ingress_net
  app_net:
    driver: bridge
    name: rycoop_test_app_net
  data_net:
    driver: bridge
    internal: true
    name: rycoop_test_data_net

volumes:
  rycoop_test_pgdata:
    name: rycoop_test_pgdata_vol
  rycoop_test_redisdata:
    name: rycoop_test_redisdata_vol
