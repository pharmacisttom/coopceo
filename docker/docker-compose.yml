version: '3.8'

name: rycoop-smart-finance-test

services:
  # 1. Reverse Proxy with TLS & SSE Buffering Configuration
  # CRITICAL SECURITY FIX: Never bind directly to host 80 or 443!
  # Live Cooperative VPS already runs production Nginx on 80/443.
  # We bind TEST Nginx to host 8080/8443 (accessible via host reverse proxy).
  nginx:
    image: nginx:1.27-alpine
    container_name: rycoop_test_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - rycoop_test_net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # 2. Next.js Frontend with SweetAlert2 & Notification Center
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: rycoop_test_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - rycoop_test_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 512M

  # 3. NestJS Backend API & Real-time SSE Service
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rycoop_test_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=test
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-rycoop-internal-worker-secret-key-99}
      - COOKIE_DOMAIN=test.rycoop.coop
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rycoop_test_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          memory: 512M

  # 4. Python FastAPI Analytics Worker (Liquidity & Bond Monitor)
  analytics-worker:
    build:
      context: ../analytics-worker
      dockerfile: Dockerfile
    container_name: rycoop_test_analytics
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=test
      - BACKEND_API_URL=http://backend:3001
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-rycoop-internal-worker-secret-key-99}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rycoop_test_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # 5. PostgreSQL 16 Database
  # CRITICAL: Ports are NOT published to host network (accessible ONLY within rycoop_test_net)
  postgres:
    image: postgres:16-alpine
    container_name: rycoop_test_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - rycoop_test_pgdata:/var/lib/postgresql/data
      - ../database/migrations/init_schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../database/seeds/seed_test_data.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    networks:
      - rycoop_test_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
        reservations:
          memory: 512M

  # 6. Redis 7 for BullMQ & SSE Deduplication Cache
  # CRITICAL: Ports are NOT published to host network
  redis:
    image: redis:7-alpine
    container_name: rycoop_test_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - rycoop_test_redisdata:/data
    networks:
      - rycoop_test_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  rycoop_test_net:
    driver: bridge
    name: rycoop_isolated_test_network

volumes:
  rycoop_test_pgdata:
    name: rycoop_test_pgdata_vol
  rycoop_test_redisdata:
    name: rycoop_test_redisdata_vol
